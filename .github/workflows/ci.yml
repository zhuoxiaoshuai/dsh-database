name: check

on:
  pull_request:
  push:
    branches: [main, codex/nacos-p0-shared-framework]

jobs:
  check:
    # The suite verifies Windows behaviours (DPAPI storage, cmd shims) and is run on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The dev dependency tree has an upstream peer conflict; the lockfile was created with legacy resolution.
      - run: npm ci --legacy-peer-deps
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run check
      - run: npm pack --dry-run
      - run: npm run test:package-closure
