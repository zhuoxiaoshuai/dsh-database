name: check

on:
  pull_request:
  push:
    branches: [main, codex/nacos-p0-shared-framework]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run
      - run: npm run test:package-closure
